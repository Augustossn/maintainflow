apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: maintainflow}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: maintainflow-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 101, allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: maintainflow}
spec: {selector: {app: web}, ports: [{port: 8080, targetPort: 8080}]}
