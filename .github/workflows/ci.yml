name: MaintainFlow CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet restore maintainflow.sln
      - run: dotnet build maintainflow.sln --no-restore -c Release
      - run: dotnet test backend/Tests --no-build -c Release --logger trx
        env: {RUN_INTEGRATION: '1'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-tests, path: '**/TestResults/*.trx'}
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-evidence, path: 'frontend/test-results/'}
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: sh tools/setup.sh
      - run: docker compose config --quiet
      - run: docker compose build api web
