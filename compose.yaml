name: maintainflow
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Execute tools/setup.ps1 or tools/setup.sh}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: maintainflow
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Configure RABBIT_PASSWORD}
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Server=sqlserver;Database=MaintainFlow;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Configure JWT_KEY}
      Auth__DemoEnabled: "true"
      Auth__DemoPassword: ${DEMO_PASSWORD:?Configure DEMO_PASSWORD}
      Database__Initialize: "true"
      Database__Seed: "true"
      RabbitMQ__Uri: amqp://maintainflow:${RABBIT_PASSWORD}@rabbitmq:5672
      Frontend__Origin: http://localhost:8082
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["127.0.0.1:5000:8080"]
    depends_on:
      sqlserver: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:8082:8080"]
    depends_on: [api]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [jaeger]
    ports: ["127.0.0.1:4317:4317"]
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["127.0.0.1:16686:16686"]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro", "prom-data:/prometheus"]
    ports: ["127.0.0.1:9091:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Configure GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes: ["./ops/grafana/provisioning:/etc/grafana/provisioning:ro", "./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
volumes:
  sql-data:
  rabbit-data:
  prom-data:
  grafana-data:
